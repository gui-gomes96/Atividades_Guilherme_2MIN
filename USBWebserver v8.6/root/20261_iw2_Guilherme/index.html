<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Cadastro de Camisas</title>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

    <script>
        //exbir das duas formas
        $(document).ready(function () {
            $('#ExibirBtn2').click(function () {

                $.ajax({

                    url: "2consulta.php",
                    type: "POST",
                    dataType: "html"

                }).done(function (resultado) {

                    $('#Exibir2').html(resultado);

                }).fail(function (jqXHR, textStatus) {

                    console.log("Erro: " + textStatus);

                });

            });

            $('#ExibirBtn1').click(function () {

                $.ajax({
                    url: "1consulta.php",
                    type: "POST",
                    dataType: "html"

                }).done(function (exibir) {

                    $('#Exibir').html(exibir);

                }).fail(function (jqXHR, textStatus) {

                    console.log("Erro: " + textStatus);

                });
            });

            //função pra registrar tudo
            $('#RegistrarBtn').click(function (e) {

                e.preventDefault();

                var cor = $('#Color').val();
                var tamanho = $('#Tamanho').val();

                if (cor == '') {
                    alert('Digite a cor');
                    return;
                }

                $.ajax({

                    url: "insert.php",
                    type: "POST",
                    dataType: "html",

                    data: {
                        campo1: cor,
                        campo2: tamanho
                    }

                }).done(function (resposta) {

                    $('#Resposta').html(resposta);

                }).fail(function (jqXHR, textStatus) {

                    console.log("Erro: " + textStatus);

                });

            });

        });

    </script>

</head>

<body>
    
    <h1>Registrar camisa</h1>

    <form>

        <input type="text" id="Color" placeholder="Cor da camisa">

        <select id="Tamanho">
            <option value="P">P</option>
            <option value="M">M</option>
            <option value="G">G</option>
            <option value="GG">GG</option>
        </select>

        <button type="submit" id="RegistrarBtn">Registrar</button>

        <button type="button" id="ExibirBtn1">Exibir</button>
        <button type="button" id="ExibirBtn2">Exibir 2</button>

    </form>

    <p id="Resposta"></p>

    <div id="Exibir"></div>
    <div id="Exibir2"></div>

</body>

</html>
